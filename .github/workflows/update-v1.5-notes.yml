name: Update v1.5 release notes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-v1.5-notes.yml']
permissions:
  contents: write
jobs:
  update-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Update release text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit v1.5.0 --repo "$GITHUB_REPOSITORY" --notes-file releases/v1.5.0/RELEASE_NOTES.md
